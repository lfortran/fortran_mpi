name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job per compiler, MPI and OS, each running the pixi environment
  # <compiler>-<mpi> (see pixi.toml).
  test:
    name: ${{ matrix.compiler }}, ${{ matrix.mpi }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gfortran, flang, ifx, lfortran]
        # mpich-abi: MPICH's MPI-5 standard ABI library, libmpi_abi
        mpi: [openmpi, mpich, mpich-abi]
        exclude:
          # conda-forge has flang and ifx for Linux only
          - os: macos-latest
            compiler: flang
          - os: macos-latest
            compiler: ifx
        include:
          - compiler: gfortran
            fc: gfortran -cpp
            opt: -O3 -march=native
          # flang and ifx put automatic arrays on the stack, and POT3D's
          # are larger than the default 8 MB
          - compiler: flang
            fc: flang -cpp
            opt: -O3 -march=native
            stack: unlimited
          - compiler: ifx
            fc: ifx -fpp
            opt: -O3 -march=native
            stack: unlimited
          - compiler: lfortran
            fc: lfortran --cpp
            opt: --fast
            pot3d: pot3d-lfortran
    env:
      ENV: ${{ matrix.compiler }}-${{ matrix.mpi }}
      POT3D: ${{ matrix.pot3d || 'pot3d' }}
      STACK: ${{ matrix.stack }}
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.1
          cache: true
          locked: true
          environments: ${{ env.ENV }}

      - name: Test without the custom MPI wrappers
        if: matrix.compiler == 'gfortran' && matrix.mpi != 'mpich-abi'
        run: pixi run -e $ENV test-without-wrappers

      - name: Test constant-only headers
        if: matrix.mpi == 'openmpi'
        run: pixi run -e $ENV test-constant-headers "${{ matrix.fc }}" "build/$ENV/constant-headers"

      - name: Test
        run: pixi run -e $ENV test "${{ matrix.fc }}"

      # MPICH 5.0.2 has a native return-before-termination race (#7716).
      # Do not claim its ordinary success-only suite qualifies MPI_Abort.
      - name: Strict intentional abort with native C control
        if: runner.os == 'Linux' && matrix.mpi == 'openmpi'
        timeout-minutes: 10
        run: pixi run --locked -e $ENV test-abort "${{ matrix.fc }}"

      - name: Test with ${{ matrix.opt }}
        run: pixi run -e $ENV test "${{ matrix.fc }} ${{ matrix.opt }}"

      # On the macOS runners POT3D takes half an hour unoptimized, and with
      # MPICH a quarter of an hour optimized
      - name: POT3D
        if: runner.os == 'Linux'
        run: |
          [ -z "$STACK" ] || ulimit -s $STACK
          pixi run -e $ENV $POT3D "${{ matrix.fc }}"

      - name: POT3D with ${{ matrix.opt }}
        if: runner.os == 'Linux' || matrix.mpi == 'openmpi'
        run: |
          [ -z "$STACK" ] || ulimit -s $STACK
          pixi run -e $ENV $POT3D "${{ matrix.fc }} ${{ matrix.opt }}"

  hdf5:
    name: Provided HDF5, ${{ matrix.compiler }}, ${{ matrix.mpi }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        compiler: [gfortran, lfortran]
        mpi: [mpich, openmpi]
        include:
          - compiler: gfortran
            flags: -cpp
          - compiler: lfortran
            flags: --cpp
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.1
          cache: true
          locked: true
          environments: ${{ matrix.compiler }}-${{ matrix.mpi }} hdf5-${{ matrix.mpi }}

      - name: Public adapter and matching native HDF5
        run: |
          pixi run --locked -e hdf5-${{ matrix.mpi }} test-provided-hdf5 \
            "$PWD/.pixi/envs/${{ matrix.compiler }}-${{ matrix.mpi }}/bin/${{ matrix.compiler }} ${{ matrix.flags }}"
