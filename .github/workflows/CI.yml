name: CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  # One job per compiler, MPI and OS, each running the pixi environment
  # <compiler>-<mpi> (see pixi.toml).
  test:
    name: ${{ matrix.compiler }}, ${{ matrix.mpi }}, ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gfortran, flang, ifx, lfortran]
        mpi: [openmpi, mpich]
        exclude:
          # conda-forge has flang and ifx for Linux only
          - os: macos-latest
            compiler: flang
          - os: macos-latest
            compiler: ifx
        include:
          # pot3d is the POT3D task; flang and ifx run the tests only
          - compiler: gfortran
            fc: gfortran -cpp
            opt: -O3 -march=native
            pot3d: pot3d
          - compiler: flang
            fc: flang -cpp
            opt: -O3 -march=native
          - compiler: ifx
            fc: ifx -fpp
            opt: -O3 -march=native
          - compiler: lfortran
            fc: lfortran --cpp
            opt: --fast
            pot3d: pot3d-lfortran
    env:
      ENV: ${{ matrix.compiler }}-${{ matrix.mpi }}
    steps:
      - uses: actions/checkout@v4

      - uses: prefix-dev/setup-pixi@v0.10.1
        with:
          pixi-version: v0.76.1
          cache: true
          locked: true
          environments: ${{ env.ENV }}

      - name: Test without the custom MPI wrappers
        if: matrix.compiler == 'gfortran'
        run: pixi run -e $ENV test-without-wrappers

      - name: Test
        run: pixi run -e $ENV test "${{ matrix.fc }}"

      - name: Test with ${{ matrix.opt }}
        run: pixi run -e $ENV test "${{ matrix.fc }} ${{ matrix.opt }}"

      # Unoptimized, POT3D takes half an hour on the macOS runners
      - name: POT3D
        if: matrix.pot3d && runner.os == 'Linux'
        run: pixi run -e $ENV ${{ matrix.pot3d }} "${{ matrix.fc }}"

      - name: POT3D with ${{ matrix.opt }}
        if: matrix.pot3d
        run: pixi run -e $ENV ${{ matrix.pot3d }} "${{ matrix.fc }} ${{ matrix.opt }}"
